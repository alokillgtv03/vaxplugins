/* Custom Settings Panel — bottom 85px: nằm TRÊN vùng thanh tiến trình
   (thanh kéo tua chiếm 53-78px từ đáy, đặt thấp hơn sẽ che vạch thời gian) */
.custom-settings-panel {
  position: absolute;
  bottom: 85px;
  right: 20px;
  z-index: 1001;
  background: rgba(20, 20, 22, 0.96);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  width: 280px;
  max-height: calc(100% - 100px);
  overflow-y: auto;
  padding: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  display: none;
  font-family: inherit;
  color: #fff;
}

/* Menu drill-down kiểu YouTube */
.settings-header {
  font-size: 14px;
  font-weight: 700;
  padding: 8px 10px 12px;
  color: #fff;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 6px;
}
.settings-header.with-back {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}
.settings-header.with-back i { font-size: 12px; color: #9a9aa0; }
.settings-header.with-back:hover i { color: #fff; }
.settings-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 11px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13.5px;
  color: #eee;
  transition: background 0.15s;
}
.settings-row:hover { background: rgba(255,255,255,0.08); }
.settings-row .row-value {
  color: #9a9aa0;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 7px;
  max-width: 140px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.settings-row .row-value i { font-size: 10px; }
.settings-option.active { color: #fff; font-weight: 600; }
.settings-option.active .row-value i { color: #f00; font-size: 13px; }
.panel-btn-inline {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  outline: none;
}
.panel-btn-inline:hover {
  background: rgba(255, 0, 0, 0.8);
  border-color: #f00;
}
.custom-settings-panel::-webkit-scrollbar {
  width: 4px;
}
.custom-settings-panel::-webkit-scrollbar-track {
  background: transparent;
}
.custom-settings-panel::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.2);
  border-radius: 2px;
}
.custom-settings-panel::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.4);
}
.custom-settings-panel.show {
  display: block;
  animation: slideUp 0.2s ease-out;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 600px) {
  .custom-settings-panel {
    width: 230px !important;
    padding: 10px 10px 40px 10px !important;
    bottom: 85px !important; /* trên vùng thanh tiến trình (53-78px) — 65px cũ đè trúng vạch kéo tua */
    right: 10px !important;
    max-height: calc(100% - 100px) !important;
  }
  .panel-section {
    margin-bottom: 8px !important;
  }
  .panel-section-title {
    font-size: 10px !important;
    margin-bottom: 4px !important;
  }
  .panel-select {
    padding: 6px 8px !important;
    font-size: 12px !important;
  }
}
.panel-section {

}
.panel-section:last-child {

.panel-select {

  color: #fff;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  cursor: pointer;
}

}

  position: relative !important;
  left: auto !important;
  top: auto !important;

// ── Resume từ localStorage ────────────────────────────────────────────────────
var VID_KEY = 'vp_pos_1420';
player.ready(function(){
  // Di chuyển Settings Panel vào trong player element để hiển thị được khi Fullscreen
  var panel = document.getElementById('customSettingsPanel');
  if (panel) {
    player.el().appendChild(panel);
  }

  // ── Gắn hls.js vào native <video> element (bỏ qua Video.js VHS để tránh CORS trên PC) ──
  var videoEl = player.el().querySelector('video');
  var metadataAudios = [];
  var metadataSubs = [];
  // iOS: LUÔN dùng HLS native (bỏ qua hls.js dù ManagedMediaSource iOS 17.1+ có thể
  // báo hỗ trợ) → sub/audio nhúng do Safari xử, đi theo vào fullscreen native.
  var useNativeHls = IS_IOS && videoEl.canPlayType('application/vnd.apple.mpegurl');

  if (!useNativeHls && typeof window.Hls !== 'undefined' && Hls.isSupported()) {
    // subtitleDisplay:false + renderTextTracksNatively:false → hls.js KHÔNG tự
    // vẽ và KHÔNG tạo native text track cho phụ đề nhúng. Nếu bật, video.js
    // (nativeTextTracks:false) sẽ nhân bản track ra vẽ lần 2 → phụ đề chồng nhau
    // + menu bị trùng. Phụ đề nhúng chỉ dành cho iOS native (nhánh else).
    var hls = new Hls({
      maxBufferLength: 30, maxMaxBufferLength: 60,
      subtitleDisplay: false,
      renderTextTracksNatively: false
    });
    hls.loadSource(M3U8_SRC);
    hls.attachMedia(videoEl);
    hlsInstance = hls; // Lưu instance toàn cục
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      if (hls.subtitleTracks && hls.subtitleTracks.length) hls.subtitleTrack = -1;
      setupAudioTracks(metadataAudios, hls);
      setupQualityTracks(hls);
      // PC/Android: luôn dùng remote VTT qua video.js (một hệ thống duy nhất)
      setupSubtitleTracks(metadataSubs);
    });
  } else {
    if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = M3U8_SRC;
      videoEl.load();
    }
    videoEl.addEventListener('loadedmetadata', function() {
      // Safari native HLS: chờ audio/text tracks in-stream xuất hiện rồi mới
      // quyết định — nếu stream không có mới fallback sang remote VTT /
      // overlay audio (iOS fullscreen native chỉ nhận track nằm trong luồng HLS)
      setTimeout(function() {
        setupAudioTracks(metadataAudios, null);
        var hasStreamSubs = videoEl.textTracks && videoEl.textTracks.length > 0;
        setupSubtitleTracks(hasStreamSubs ? [] : metadataSubs);
      }, 500);
    });
  }

  // Khởi tạo style settings cho phụ đề
  initStyleSettings();

  // iOS (iPhone + iPad): LUÔN dùng fullscreen NATIVE của thẻ video để sub/audio
  // native đi theo vào fullscreen. Mặc định iPad có Fullscreen API cho phần tử nên
  // video.js dùng element-fullscreen (sub native không hiện) → ép iPad theo cách
  // native của thẻ video cho ĐỒNG NHẤT với iPhone.
  if (IS_IOS) {
    var iosVEl = player.el().querySelector('video');
    if (iosVEl && typeof iosVEl.webkitEnterFullscreen === 'function') {
      player.requestFullscreen = function() {
        try { iosVEl.webkitEnterFullscreen(); } catch (e) {}
        return Promise.resolve();
      };
    }
  }

  // Fallback fullscreen: iframe thiếu allowfullscreen hoặc trình duyệt không có
  // Fullscreen API → dùng trình phát fullscreen native của video element
  player.on('fullscreenerror', function() {
    var vEl = player.el().querySelector('video');
    if (vEl && typeof vEl.webkitEnterFullscreen === 'function') {
      try { vEl.webkitEnterFullscreen(); } catch (err) {}
    }
  });

  // Lắng nghe click/touch lên toàn bộ màn hình video để Play/Pause (sửa lỗi PC và Mobile không click được)
  var lastTap = 0;
  ['click', 'touchend'].forEach(function(evt) {
    player.el().addEventListener(evt, function(e){
      if(e.target.closest('.vjs-control-bar') || e.target.closest('.vjs-big-play-button') || e.target.closest('.vjs-menu-button-popup') || e.target.closest('#customSettingsPanel')) return;
      var now = Date.now();
      if (window.__settingsClosedAt && now - window.__settingsClosedAt < 500) return; // click này vừa dùng để đóng menu cài đặt
      if (now - lastTap < 300) return; // chống dội lệnh kép touchend + click
      lastTap = now;
      if(player.paused()){ player.play(); player.userActive(true); } else { player.pause(); player.userActive(true); }
    }, { passive: false });
  });

  // Tự động xoay ngang màn hình (Landscape) khi bấm Fullscreen trên Điện thoại
  player.on('fullscreenchange', function() {
    if(player.isFullscreen()) {
      if(screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(function(){}); }
      else if(screen.lockOrientation) { screen.lockOrientation('landscape'); }
    } else {
      if(screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); }
      else if(screen.unlockOrientation) { screen.unlockOrientation(); }
    }
  });

  var saved = parseFloat(localStorage.getItem(VID_KEY)||'0');
  if(saved>10){
    var h=Math.floor(saved/3600),m=Math.floor((saved%3600)/60),s=Math.floor(saved%60);
    document.getElementById('resume-time-str').textContent=(h?h+':':'')+(h?String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');
    setTimeout(function(){document.getElementById('resume-toast').classList.add('show');},1000);
    document.getElementById('btn-resume-yes').onclick=function(){player.currentTime(saved);document.getElementById('resume-toast').remove();};
    document.getElementById('btn-resume-no').onclick=function(){document.getElementById('resume-toast').remove();};
  }
  setInterval(function(){if(!player.paused())localStorage.setItem(VID_KEY,player.currentTime());},5000);
});

// ── Menu Cài đặt drill-down (kiểu YouTube): Chất lượng / Phụ đề / Âm thanh /
//    Kiểu phụ đề / Tốc độ. Đọc trạng thái từ các select ẩn để vẽ danh sách. ──
var SPEED_OPTIONS = [0.5, 0.75, 1, 1.25, 1.5, 2];

function settingsSelText(sel) {
  var o = sel.options[sel.selectedIndex];
  return o ? o.textContent : '';
}

function renderSettingsMenu(view) {
  var wrap = document.getElementById('settingsViews');
  if (!wrap) return;

  var selSub     = document.getElementById('cfgSubSelect');
  var selAudio   = document.getElementById('cfgAudioSelect');
  var selQuality = document.getElementById('cfgQualitySelect');
  var qualityOn  = document.getElementById('qualitySection').style.display !== 'none';

  function navRow(target, label, value) {
    return '<div class="settings-row" data-nav="' + target + '"><span>' + label + '</span>' +
      '<span class="row-value">' + value + ' <i class="fas fa-chevron-right"></i></span></div>';
  }
  function backHeader(title, backTo) {
    return '<div class="settings-header with-back" data-nav="' + (backTo || 'main') + '">' +
      '<i class="fas fa-chevron-left"></i> ' + title + '</div>';
  }
  function optionRows(sel, backTo) {
    var out = '';
    for (var i = 0; i < sel.options.length; i++) {
      var o = sel.options[i];
      var active = (i === sel.selectedIndex);
      out += '<div class="settings-row settings-option' + (active ? ' active' : '') + '"' +
        ' data-select="' + sel.id + '" data-value="' + String(o.value).replace(/"/g, '&quot;') + '"' +
        ' data-back="' + backTo + '"><span>' + o.textContent + '</span>' +
        '<span class="row-value">' + (active ? '<i class="fas fa-check"></i>' : '') + '</span></div>';
    }
    return out;
  }

  var html = '';
  if (view === 'main') {
    html = '<div class="settings-header">Cài đặt</div>';
    if (qualityOn) html += navRow('quality', 'Chất lượng', settingsSelText(selQuality));
    html += navRow('sub', 'Phụ đề', settingsSelText(selSub));
    html += navRow('audio', 'Âm thanh', settingsSelText(selAudio));
    html += navRow('substyle', 'Kiểu phụ đề', 'Tuỳ chỉnh');
    html += navRow('speed', 'Tốc độ', player.playbackRate() + 'x');
  } else if (view === 'quality') {
    html = backHeader('Chất lượng') + optionRows(selQuality, 'main');
  } else if (view === 'sub') {
    html = backHeader('Phụ đề') + optionRows(selSub, 'main');
  } else if (view === 'audio') {
    html = backHeader('Âm thanh') + optionRows(selAudio, 'main');
  } else if (view === 'speed') {
    html = backHeader('Tốc độ');
    var cur = player.playbackRate();
    SPEED_OPTIONS.forEach(function(r) {
      var active = Math.abs(cur - r) < 0.001;
      html += '<div class="settings-row settings-option' + (active ? ' active' : '') + '" data-speed="' + r + '">' +
        '<span>' + (r === 1 ? 'Chuẩn (1x)' : r + 'x') + '</span>' +
        '<span class="row-value">' + (active ? '<i class="fas fa-check"></i>' : '') + '</span></div>';
    });
  } else if (view === 'substyle') {
    html = backHeader('Kiểu phụ đề') +
      navRow('subsize',  'Cỡ chữ',  settingsSelText(document.getElementById('cfgSubSize'))) +
      navRow('subcolor', 'Màu chữ', settingsSelText(document.getElementById('cfgSubColor'))) +
      navRow('subpos',   'Vị trí',  settingsSelText(document.getElementById('cfgSubPos'))) +
      navRow('subbg',    'Nền',     settingsSelText(document.getElementById('cfgSubBg')));
  } else if (view === 'subsize') {
    html = backHeader('Cỡ chữ', 'substyle') + optionRows(document.getElementById('cfgSubSize'), 'substyle');
  } else if (view === 'subcolor') {
    html = backHeader('Màu chữ', 'substyle') + optionRows(document.getElementById('cfgSubColor'), 'substyle');
  } else if (view === 'subpos') {
    html = backHeader('Vị trí', 'substyle') + optionRows(document.getElementById('cfgSubPos'), 'substyle');
  } else if (view === 'subbg') {
    html = backHeader('Nền', 'substyle') + optionRows(document.getElementById('cfgSubBg'), 'substyle');
  }

  wrap.innerHTML = html;
}

// Điều hướng menu bằng event delegation (bind 1 lần, sống sót qua innerHTML thay đổi)
document.getElementById('customSettingsPanel').addEventListener('click', function(e) {
  var el = e.target.closest('[data-nav],[data-select],[data-speed]');

// Badge nhỏ hiển thị chất lượng đang chọn nổi trên nút bánh răng (kiểu YouTube)
function updateSettingsBadge() {
  var badge = document.getElementById('settingsQualityBadge');
  if (!badge) return;
  var section = document.getElementById('qualitySection');
  var sel = document.getElementById('cfgQualitySelect');
  if (!sel || !section || section.style.display === 'none' || !sel.options.length) {
    badge.style.display = 'none';
    return;
  }
  var opt = sel.options[sel.selectedIndex];
  var txt = opt ? opt.textContent : '';
  if (txt.indexOf('Tự động') !== -1) txt = 'Auto';
  else if (txt.indexOf('4K') !== -1) txt = '4K';
  badge.textContent = txt;
  badge.style.display = 'block';
}

function setupQualityTracks(hls) {
  var select = document.getElementById('cfgQualitySelect');
  var section = document.getElementById('qualitySection');
  if (!select || !section) return;

  select.innerHTML = '';

  if (!hls || !hls.levels || hls.levels.length <= 1) {
    section.style.display = 'none';
    updateSettingsBadge();
    return;
  }

  section.style.display = 'block';

  var capIdx = -1;
  hls.levels.forEach(function(level, idx) {
    if (level.height <= 1080) capIdx = idx;
  });
  var hasAbove1080 = capIdx !== -1 && capIdx < hls.levels.length - 1;

  function labelFor(level) {
    // 4K ultrawide có height < 2160 (vd 3832x1592) → nhận diện theo width
    if (level.height >= 2000 || level.width >= 3000) return '4K (' + level.height + 'p)';
    if (level.height === 1080) return '1080p';
    if (level.height === 720) return '720p';
    return level.height + 'p';
  }

  if (hasAbove1080) {
    // Video có bậc trên 1080p (4K): CHỈ 2 lựa chọn — 1080p (mặc định, khóa cứng)
    // và 4K (chọn tay khi cần). Không hiện "Tự động" vì với video 1080p+4K thì
    // Auto giới hạn 1080p ⇢ luôn ra 1080p, trùng hệt lựa chọn 1080p → thừa.
    // Khóa 1080p tránh box/điện thoại tự nhảy 4K gây vỡ hình.
    hls.autoLevelCapping = -1;
    hls.currentLevel = capIdx;
    hls.levels.forEach(function(level, idx) {
      var opt = document.createElement('option');
      opt.value = idx.toString();
      opt.textContent = labelFor(level);
      select.appendChild(opt);
    });
    select.value = capIdx.toString();
  } else {
    // Video không có 4K (chỉ ≤1080p): giữ "Tự động" để thích ứng băng thông
    hls.autoLevelCapping = -1;
    var optAuto = document.createElement('option');
    optAuto.value = '-1';
    optAuto.textContent = 'Tự động (Auto)';
    select.appendChild(optAuto);
    hls.levels.forEach(function(level, idx) {
      var opt = document.createElement('option');
      opt.value = idx.toString();
      opt.textContent = labelFor(level);
      select.appendChild(opt);
    });
    select.value = hls.currentLevel.toString();
  }
  updateSettingsBadge();

  select.onchange = function() {
    var val = parseInt(this.value);
    if (hlsInstance) {
      hlsInstance.currentLevel = val;
    }
    updateSettingsBadge();
  };
}

function updateNativeCuePositions() {
  const tracks = player.textTracks();
  const posValStr = localStorage.getItem('vp_sub_pos') || '18%';
  const percentage = 100 - parseFloat(posValStr); // "18%" -> 82% từ top
  
  for (let i = 0; i < tracks.length; i++) {
    const track = tracks[i];
    if (!track._cueListenerAdded) {
      track.addEventListener('cuechange', function() {
        const activeCues = this.activeCues;
        if (activeCues) {
          for (let j = 0; j < activeCues.length; j++) {
            const cue = activeCues[j];
            if (cue.snapToLines !== false || cue.line !== percentage) {
              cue.snapToLines = false;
              cue.line = percentage;
            }
          }
        }
      });
      track._cueListenerAdded = true;
    }
    
    // Cập nhật các cue đang hoạt động ngay lập tức
    const activeCues = track.activeCues;
    if (activeCues) {
      for (let j = 0; j < activeCues.length; j++) {
        const cue = activeCues[j];
        if (cue.snapToLines !== false || cue.line !== percentage) {
          cue.snapToLines = false;
          cue.line = percentage;
        }
      }
    }
  }
}

  const bg = localStorage.getItem('vp_sub_bg') || 'rgba(0, 0, 0, 0.5)';
  const pos = localStorage.getItem('vp_sub_pos') || '18%';
  
  document.documentElement.style.setProperty('--sub-font-size', size);
  document.documentElement.style.setProperty('--sub-color', color);
  document.documentElement.style.setProperty('--sub-bg', bg);
  document.documentElement.style.setProperty('--sub-position', pos);

  // Ghi đè CSS cho native ::cue của trình duyệt di động (tránh lỗi cô lập lớp hiển thị phụ đề không nhận CSS variables)
  let styleEl = document.getElementById('dynamic-cue-styles');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'dynamic-cue-styles';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = `
    video::cue {
      color: ${color} !important;
      font-size: ${size} !important;
      font-weight: bold !important;
      background: ${bg} !important;
    }
    .video-js video::cue {
      color: ${color} !important;
      font-size: ${size} !important;
      font-weight: bold !important;
      background: ${bg} !important;
    }
    #my-video::cue {
      color: ${color} !important;
      font-size: ${size} !important;
      font-weight: bold !important;
      background: ${bg} !important;
    }
  `;

  // Cập nhật vị trí cho native text track cues
  updateNativeCuePositions();
}

function initStyleSettings() {
  const sizeSelect = document.getElementById('cfgSubSize');
  const colorSelect = document.getElementById('cfgSubColor');
  const posSelect = document.getElementById('cfgSubPos');
  const bgSelect = document.getElementById('cfgSubBg');
  
  sizeSelect.value = localStorage.getItem('vp_sub_size') || '24px';
  colorSelect.value = localStorage.getItem('vp_sub_color') || '#ffffff';
  posSelect.value = localStorage.getItem('vp_sub_pos') || '18%';
  bgSelect.value = localStorage.getItem('vp_sub_bg') || 'rgba(0, 0, 0, 0.5)';
  
  applySubStyles();
  
  sizeSelect.onchange = function() { localStorage.setItem('vp_sub_size', this.value); applySubStyles(); };
  colorSelect.onchange = function() { localStorage.setItem('vp_sub_color', this.value); applySubStyles(); };
  posSelect.onchange = function() { localStorage.setItem('vp_sub_pos', this.value); applySubStyles(); };
  bgSelect.onchange = function() { localStorage.setItem('vp_sub_bg', this.value); applySubStyles(); };
}

// ── Audio Overlay Synchronization (thuyết minh chồng lên tiếng gốc) ──────────
var syncAudioEl = null;
var syncHls = null;
var isSyncingAudio = false;
var currentAudioTrackUrl = null;
var syncListenersAdded = false;

// Gắn listener đồng bộ MỘT LẦN vào player; luôn đọc syncAudioEl hiện tại (biến
// module) nên vẫn đúng dù element được tạo mới mỗi lần chọn thuyết minh.
function ensureSyncListeners() {
  if (syncListenersAdded) return;
  syncListenersAdded = true;
  player.on('play', function() {
    if (isSyncingAudio && syncAudioEl && syncAudioEl.paused) syncAudioEl.play().catch(function(){});
  });
  player.on('pause', function() {
    if (isSyncingAudio && syncAudioEl && !syncAudioEl.paused) syncAudioEl.pause();
  });
  player.on('ended', function() {
    if (syncAudioEl) { syncAudioEl.pause(); try { syncAudioEl.currentTime = 0; } catch(e){} }
  });
  player.on('timeupdate', function() {
    if (!isSyncingAudio || !syncAudioEl) return;
    // Hồi overlay nếu nó bị khựng/tự dừng giữa chừng ("chạy 1 lúc rồi mất")
    if (!player.paused() && syncAudioEl.paused) { syncAudioEl.play().catch(function(){}); }
    var vt = player.currentTime();
    var driff = vt - syncAudioEl.currentTime;
    var ad = Math.abs(driff);
    if (ad > 0.75) {
      // Lệch lớn → seek 1 lần (tránh seek liên tục gây rebuffer vòng lặp → câm)
      try { syncAudioEl.currentTime = vt; } catch(e){}
    } else if (ad > 0.08) {
      // Lệch nhỏ → chỉnh tốc độ kéo về, KHÔNG seek (không rebuffer)
      syncAudioEl.playbackRate = player.playbackRate() * (driff > 0 ? 1.05 : 0.95);
    } else {
      syncAudioEl.playbackRate = player.playbackRate();
    }
  });
  player.on('seeking', function() { if (isSyncingAudio && syncAudioEl) { try { syncAudioEl.currentTime = player.currentTime(); } catch(e){} } });
  player.on('seeked',  function() { if (isSyncingAudio && syncAudioEl) { try { syncAudioEl.currentTime = player.currentTime(); } catch(e){} } });
  player.on('ratechange', function() { if (syncAudioEl) syncAudioEl.playbackRate = player.playbackRate(); });
  player.on('volumechange', function() { applyAudioSyncVolumes(); });
  // Watchdog tự hồi: bắt cả trường hợp thẻ audio "đứng hình" (không paused nhưng
  // currentTime đóng băng do hls.js thứ 2 ngừng nạp buffer / chết) — nguyên nhân
  // "chạy 1 lúc rồi mất" mà điều kiện .paused không bắt được. Đứng im ~3s → DỰNG LẠI luồng.
  var wdLast = -1, wdStall = 0, wdHealAt = 0;
  setInterval(function() {
    if (!isSyncingAudio || !syncAudioEl || player.paused()) { wdLast = -1; wdStall = 0; return; }
    if (syncAudioEl.paused || syncAudioEl.ended) { syncAudioEl.play().catch(function(){}); }
    var t = syncAudioEl.currentTime;
    if (Math.abs(t - wdLast) < 0.05) { wdStall++; } else { wdStall = 0; }
    wdLast = t;
    // Đứng im ~3s → coi luồng đã chết → dựng lại tại đúng vị trí (chặn dựng dồn: tối đa 8s/lần)
    if (wdStall >= 3 && currentAudioTrackUrl && (Date.now() - wdHealAt > 8000)) {
      wdHealAt = Date.now();
      wdStall = 0;
      initSyncAudio(currentAudioTrackUrl);
    }
  }, 1000);
}

function initSyncAudio(audioUrl) {
  ensureSyncListeners();

  // Huỷ HẲN element + hls cũ rồi tạo mới hoàn toàn. Tái dùng element cũ (sau khi
  // đã src='' / detach) là nguyên nhân "chọn lại thuyết minh bị mất tiếng".
  if (syncHls) { try { syncHls.destroy(); } catch(e){} syncHls = null; }
  if (syncAudioEl) { try { syncAudioEl.pause(); } catch(e){} try { syncAudioEl.remove(); } catch(e){} syncAudioEl = null; }

  syncAudioEl = document.createElement('audio');
  syncAudioEl.style.display = 'none';
  syncAudioEl.preload = 'auto';
  document.body.appendChild(syncAudioEl);

  var resolvedUrl = audioUrl;
  var baseCdn = isLegacy ? 'https://sv1.rophim.mom' : '';
  if (!resolvedUrl.startsWith('http')) {
    resolvedUrl = baseCdn + (resolvedUrl.startsWith('/') ? '' : '/') + resolvedUrl;
  }

  isSyncingAudio = true;
  currentAudioTrackUrl = resolvedUrl;

  var elForThisRun = syncAudioEl; // khoá đúng element của lần chọn này
  var started = false;
  var startPlayback = function() {
    if (started || elForThisRun !== syncAudioEl) return; // chống gọi trùng / gọi nhầm element cũ
    started = true;
    try { syncAudioEl.currentTime = player.currentTime(); } catch(e){}
    syncAudioEl.playbackRate = player.playbackRate();
    applyAudioSyncVolumes();
    if (!player.paused()) syncAudioEl.play().catch(function(){});
  };

  // Phát dựa trên 'canplay' của chính thẻ audio — đáng tin cho CẢ hls.js lẫn native,
  // KHÔNG bị lỡ như khi chỉ nghe MANIFEST_PARSED (playlist đã cache có thể fire
  // trước khi listener kịp gắn → nguyên nhân "chọn lại thuyết minh bị câm").
  syncAudioEl.addEventListener('canplay', startPlayback);

  // Trình duyệt phát được HLS native (TV Samsung/LG, Safari) → dùng native cho
  // thẻ audio, KHÔNG mở hls.js/MSE thứ 2. Tizen chỉ có 1 pipeline MSE: mở
  // MediaSource thứ 2 làm chết luồng video (màn đen, còn tiếng, không tua được).
  if (syncAudioEl.canPlayType('application/vnd.apple.mpegurl')) {
    syncAudioEl.src = resolvedUrl;
    syncAudioEl.load();
  } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    syncHls = new Hls();
    syncHls.on(Hls.Events.MANIFEST_PARSED, startPlayback); // đăng ký TRƯỚC loadSource
    // Tự phục hồi khi luồng audio thứ 2 lỗi mạng/decode (không có sẽ "chạy 1 lúc rồi mất")
    syncHls.on(Hls.Events.ERROR, function(evt, data) {
      if (!data || !data.fatal || elForThisRun !== syncAudioEl) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { try { syncHls.startLoad(); } catch(e){} }
      else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { try { syncHls.recoverMediaError(); } catch(e){} }
      else { try { syncHls.destroy(); } catch(e){} syncHls = null; }
    });
    syncHls.loadSource(resolvedUrl);
    syncHls.attachMedia(syncAudioEl);
  } else {
    syncAudioEl.src = resolvedUrl;
    syncAudioEl.load();
  }
}

function stopSyncAudio() {
  isSyncingAudio = false;
  currentAudioTrackUrl = null;
  if (syncHls) { try { syncHls.destroy(); } catch(e){} syncHls = null; }
  if (syncAudioEl) {
    try { syncAudioEl.pause(); } catch(e){}
    try { syncAudioEl.remove(); } catch(e){}
    syncAudioEl = null;
  }
}

function applyAudioSyncVolumes() {
  if (!isSyncingAudio || !syncAudioEl) return;

  // Thuyết minh phát ĐỒNG THỜI với tiếng gốc (kiểu thuyết minh VN: giọng đọc
  // chồng lên nền tiếng gốc). Overlay theo âm lượng/mute của player, KHÔNG câm gốc.
  syncAudioEl.volume = player.volume();
  syncAudioEl.muted = player.muted();
}

function setupAudioTracks(metadataAudios, hls) {
  var audioSelect = document.getElementById('cfgAudioSelect');
  if (!audioSelect) return;
  
  audioSelect.innerHTML = '';
  var addedTrackNames = new Set();
  
  var mainVideo = player.el().querySelector('video');
  var hasHlsTracks = hls && hls.audioTracks && hls.audioTracks.length > 0;
  var hasNativeTracks = mainVideo && mainVideo.audioTracks && mainVideo.audioTracks.length > 0;

  // hls.js (PC/Android, cả Safari desktop) → phát thuyết minh bằng OVERLAY (đáng tin;
  // hls.js KHÔNG đọc được alternate-audio của video ABR muxed). Native (iPhone, hls=null)
  // → dùng track trộn nhúng trong master (Apple xử đúng; iOS chặn autoplay <audio>).
  var usePcOverlay = !!hls;

  // Nhãn audio ĐÃ TRỘN (mixed): trên PC overlay bằng giọng đọc _voice → bỏ track nhúng
  // trùng tên khỏi danh sách HLS để không trùng lặp.
  var mixedNames = {};
  (metadataAudios || []).forEach(function(a) {
    if (a.status === 'completed' && a.mixed) mixedNames[a.label || ('Thuyết minh ' + (a.lang || '').toUpperCase())] = true;
  });
  function voiceUrlOf(u) { return String(u || '').replace(/(audio_[a-zA-Z0-9]+)\/playlist\.m3u8/, '$1_voice/playlist.m3u8'); }

  // 1. Liệt kê track nhúng (HLS hoặc native)
  if (hasHlsTracks) {
    hls.audioTracks.forEach(function(track, idx) {
      var labelText = (idx === 0) ? 'Âm thanh gốc' : (track.name || ('Audio ' + (idx + 1)));
      if (idx !== 0 && mixedNames[labelText]) return; // để overlay _voice lo (tránh trùng + lỗi ABR)
      addedTrackNames.add(labelText);
      var opt = document.createElement('option');
      opt.value = 'hls:' + idx;
      opt.textContent = labelText;
      audioSelect.appendChild(opt);
    });
  } else if (hasNativeTracks) {
    var tracks = mainVideo.audioTracks;
    for (var i = 0; i < tracks.length; i++) {
      var labelText = (i === 0) ? 'Âm thanh gốc' : (tracks[i].label || tracks[i].language || ('Audio ' + (i + 1)));
      addedTrackNames.add(labelText);
      var opt = document.createElement('option');
      opt.value = 'native:' + i;
      opt.textContent = labelText;
      audioSelect.appendChild(opt);
    }
  }

  // 2. Add fallback original audio option ONLY if no embedded tracks exist
  if (!hasHlsTracks && !hasNativeTracks) {
    var opt = document.createElement('option');
    opt.value = '-1';
    opt.textContent = 'Âm thanh gốc';
    audioSelect.appendChild(opt);
    addedTrackNames.add('Âm thanh gốc');
  }

  // 3. Overlay thuyết minh — CHỈ trên nhánh hls.js (PC/Android). Giọng đọc chồng
  //    lên tiếng gốc. Audio đã trộn (mixed) → overlay bằng track _voice (giọng thuần);
  //    audio chưa trộn → dùng chính url của nó (vốn là giọng thuần).
  var hasDbAudio = false;
  var firstDbAudioUrl = '';
  if (usePcOverlay) {
    (metadataAudios || []).forEach(function(audio) {
      if (audio.status !== 'completed') return;
      var labelText = audio.label || ('Thuyết minh ' + (audio.lang || '').toUpperCase());
      if (addedTrackNames.has(labelText)) return;
      addedTrackNames.add(labelText);
      var ovUrl = audio.mixed ? voiceUrlOf(audio.url) : audio.url;
      var opt = document.createElement('option');
      opt.value = 'db:' + ovUrl;
      opt.textContent = labelText;
      audioSelect.appendChild(opt);
      if (!hasDbAudio) { hasDbAudio = true; firstDbAudioUrl = ovUrl; }
    });
  }
  
  audioSelect.onchange = function() {
    var val = this.value;
    if (val === "-1") {
      stopSyncAudio();
      if (hls && hls.audioTracks.length > 0) {
        hls.audioTrack = 0;
      } else if (mainVideo && mainVideo.audioTracks && mainVideo.audioTracks.length > 0) {
        for (var i = 0; i < mainVideo.audioTracks.length; i++) {
          mainVideo.audioTracks[i].enabled = (i === 0);
        }
      }
    } else if (val.startsWith('db:')) {
      stopSyncAudio();
      if (hls && hls.audioTracks.length > 0) hls.audioTrack = 0; // video chính phát TIẾNG GỐC, overlay chồng giọng
      initSyncAudio(val.substring(3));
    } else if (val.startsWith('hls:')) {
      stopSyncAudio();
      if (hls) {
        hls.audioTrack = parseInt(val.substring(4));
      }
    } else if (val.startsWith('native:')) {
      stopSyncAudio();
      if (mainVideo && mainVideo.audioTracks) {
        var idx = parseInt(val.substring(7));
        for (var i = 0; i < mainVideo.audioTracks.length; i++) {
          mainVideo.audioTracks[i].enabled = (i === idx);
        }
      }
    }
  };

  // Mặc định phát thuyết minh.
  if (hasDbAudio && firstDbAudioUrl) {
    // PC: overlay giọng đọc + tiếng gốc (video chính phát gốc)
    if (hls && hls.audioTracks.length > 0) hls.audioTrack = 0;
    audioSelect.value = 'db:' + firstDbAudioUrl;
    initSyncAudio(firstDbAudioUrl);
  } else if (hasNativeTracks) {
    // iPhone: bật track trộn nhúng (track 1) trong master
    if (mainVideo.audioTracks.length > 1) {
      for (var i = 0; i < mainVideo.audioTracks.length; i++) {
        mainVideo.audioTracks[i].enabled = (i === 1);
      }
    }
    for (var j = 0; j < mainVideo.audioTracks.length; j++) {
      if (mainVideo.audioTracks[j].enabled) {
        audioSelect.value = 'native:' + j;
        break;
      }
    }
  } else if (hasHlsTracks) {
    // Hiếm: hls.js đọc được alternate-audio → chọn luồng thuyết minh (index 1)
    if (hls.audioTracks.length > 1 && hls.audioTrack === 0) hls.audioTrack = 1;
    var currentTrack = hls.audioTrack;
    if (currentTrack !== -1 && currentTrack !== undefined) audioSelect.value = 'hls:' + currentTrack;
  }
}

function setupSubtitleTracks(metadataSubs) {
  var subSelect = document.getElementById('cfgSubSelect');
  if (!subSelect) return;

  subSelect.innerHTML = '<option value="-1">Tắt phụ đề</option>';

  var textTracks = player.textTracks();

  // Xoá HẾT remote text track cũ để hàm chạy lại không cộng dồn → nhân đôi phụ đề
  if (player.remoteTextTracks) {
    var olds = player.remoteTextTracks(), rm = [];
    for (var i = 0; i < olds.length; i++) rm.push(olds[i]);
    rm.forEach(function(t){ try { player.removeRemoteTextTrack(t); } catch(e){} });
  }

  var hasSubActive = false;

  if (metadataSubs && metadataSubs.length) {
    metadataSubs.forEach(function(sub) {
      var src = sub.url;
      var baseCdn = isLegacy ? 'https://sv1.rophim.mom' : '';
      if (src.startsWith('videos/')) {
        src = baseCdn + '/api/stream/lv0001420/subtitles/' + src.split('/').pop();
      } else if (!src.startsWith('http')) {
        src = baseCdn + '/' + src.replace(/^\//, '');
      }
      player.addRemoteTextTrack({
        kind: 'subtitles', src: src, srclang: sub.lang, label: sub.label, default: false
      }, true);
    });
  }

  function isSub(t){ return t && (t.kind === 'subtitles' || t.kind === 'captions'); }
  function keyOf(t){ return (t.label || '') + '|' + (t.language || ''); }

  var updateSubMenu = function() {
    var tracks = textTracks;

    // Đảm bảo TỐI ĐA 1 track đang hiển thị (chống 2 phụ đề chồng nếu có track trùng)
    var shownOnce = false;
    for (var i = 0; i < tracks.length; i++) {
      if (!isSub(tracks[i])) continue;
      if (tracks[i].mode === 'showing') {
        if (shownOnce) tracks[i].mode = 'disabled';
        else shownOnce = true;
      }
    }

    // Auto bật phụ đề đầu tiên nếu chưa track nào hiển thị
    if (!hasSubActive && !shownOnce) {
      for (var j = 0; j < tracks.length; j++) {
        if (isSub(tracks[j])) { tracks[j].mode = 'showing'; hasSubActive = true; break; }
      }
    }

    // Dựng menu: gộp trùng theo nhãn+ngôn ngữ (1 file sub chỉ hiện 1 dòng)
    subSelect.innerHTML = '<option value="-1">Tắt phụ đề</option>';
    var seen = {};
    for (var k = 0; k < tracks.length; k++) {
      if (!isSub(tracks[k])) continue;
      var key = keyOf(tracks[k]);
      if (seen[key]) continue;
      seen[key] = true;
      var opt = document.createElement('option');
      opt.value = k;
      opt.textContent = tracks[k].label || tracks[k].language || ('Sub ' + (k + 1));
      if (tracks[k].mode === 'showing') opt.selected = true;
      subSelect.appendChild(opt);
    }
  };

  textTracks.addEventListener('addtrack', function(){ updateSubMenu(); updateNativeCuePositions(); });
  textTracks.addEventListener('change',   function(){ updateSubMenu(); updateNativeCuePositions(); });
  updateSubMenu();
  updateNativeCuePositions();

  subSelect.onchange = function() {
    var selectedIdx = parseInt(this.value);
    var tracks = textTracks;
    if (selectedIdx === -1) hasSubActive = true; // đừng auto bật lại sau khi user tắt
    // Bật đúng 1 track được chọn, tắt tất cả còn lại (kể cả track trùng nhãn)
    for (var i = 0; i < tracks.length; i++) {
      if (isSub(tracks[i])) tracks[i].mode = (i === selectedIdx) ? 'showing' : 'disabled';
    }
  };
}
